[uwsgi]
#socket=/usr/src/app/escriptorium/app.sock
#chmod-socket=664
http=:8000
#chdir=%dapp/
chdir=/usr/src/app/
module=escriptorium.wsgi:application
# More than one worker, so that a question to the AI Chat assistant (which
# holds a worker while the model answers, up to ASSISTANT['TIMEOUT'])
# does not stall every other request.
processes = 2
threads = 4
#stats = 127.0.0.1:9191
vacuum=True
